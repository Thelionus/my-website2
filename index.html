<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Embed Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: white;
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            margin-bottom: 40px;
            background: #000;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .status {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .warning { background: #8B4513; }
        .info { background: #2a2a5a; }
    </style>
</head>
<body>
    <h1>YouTube Embed Test</h1>
    
    <div class="status warning">
        <strong>⚠️ If videos don't play:</strong><br>
        1. You may be opening this file locally (file://) - YouTube blocks local embeds<br>
        2. Try: <code>python -m http.server 8000</code> then visit <code>localhost:8000</code><br>
        3. Or upload to any web server
    </div>

    <div class="status info">
        <strong>Protocol check:</strong> <span id="protocol"></span>
    </div>

    <h2>Video 1: Rain Sounds</h2>
    <div class="video-wrapper">
        <iframe 
            src="https://www.youtube.com/embed/q76bMs-NwRk" 
            title="Test Video 1"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>
    </div>

    <h2>Video 2: Costa Rica 4K</h2>
    <div class="video-wrapper">
        <iframe 
            src="https://www.youtube.com/embed/LXb3EKWsInQ" 
            title="Test Video 2"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>
    </div>

    <script>
        // Check if opened locally
        const protocol = window.location.protocol;
        const protocolEl = document.getElementById('protocol');
        
        if (protocol === 'file:') {
            protocolEl.innerHTML = '<span style="color: #ff6b6b;">❌ FILE:// - YouTube will NOT work! Use a web server.</span>';
        } else {
            protocolEl.innerHTML = '<span style="color: #69db7c;">✓ ' + protocol + ' - Should work!</span>';
        }
    </script>
</body>
</html>
